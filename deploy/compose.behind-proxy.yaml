# Вариант для машины, где уже стоит обратный прокси (Caddy, nginx, Traefik): он держит 80/443
# и сертификаты, а у limbo портов наружу нет. Фронт и API входят во внешнюю сеть прокси
# под именами limbo-web и limbo-api, и прокси отправляет туда свой домен:
#   /api/*        → limbo-api:8080
#   всё остальное → limbo-web:8080
# Фронт и API на одном домене, поэтому адрес API не вшивается, а CORS не мешает.
#
# Имена сервисов во внешней сети уникальные намеренно: имя сервиса — это и DNS-имя во всех его
# сетях, и сервис по имени api перехватил бы запросы прокси к чужому api.
#
#   docker network create edge   # один раз; имя — PROXY_NETWORK в .env
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/compose.behind-proxy.yaml --env-file deploy/.env up -d --build

name: limbo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loadline
      POSTGRES_USER: loadline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadline -d loadline"]
      interval: 10s
      retries: 5

  # Миграции базы: одноразовый запуск EF bundle из образа API, до старта самого API.
  migrate:
    image: limbo-api
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    entrypoint: ["./efbundle"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__loadline: Host=postgres;Database=loadline;Username=loadline;Password=${POSTGRES_PASSWORD}

  limbo-api:
    image: limbo-api
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__loadline: Host=postgres;Database=loadline;Username=loadline;Password=${POSTGRES_PASSWORD}
      Cors__Origins__0: ${WEB_ORIGIN:?задайте WEB_ORIGIN в .env}
    networks: [default, proxy]

  limbo-web:
    image: limbo-web
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-edge}

volumes:
  pg-data:
